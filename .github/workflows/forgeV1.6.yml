      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages (runner's preinstalled SDK)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Name the APK forgeV1.6
        run: cp app/build/outputs/apk/debug/app-debug.apk forgeV1.6.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: forgeV1.6
          path: forgeV1.6.apk
          if-no-files-found: error
