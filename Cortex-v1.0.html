// Cortex smart request analyzer: multi-signal scoring for kd + effort
function analyzeRequest(t){
  const words=t.trim().split(/\s+/).filter(Boolean);
  const len=words.length, chars=t.length;
  const hasCode=/```|function\s*\(|def\s+\w+|class\s+\w+|import\s+|public\s+|private\s+|console\.|System\.out|printf|#include|template\s*<|std::/i.test(t);
  const hasMath=/[=+\-*/^√∫∑∏≈≠≤≥]|\\frac|equation|derivative|integral|prove that|solve for/i.test(t);
  const hasReason=/\b(why|how does|explain|compare|analyze|analyse|reason|evaluate|critique|trade-?off|pros and cons|step by step|think carefully|deep dive|thoroughly)\b/i.test(t);
  const hasWrite=/\b(write|essay|story|poem|email|letter|rewrite|translate|caption|blog|draft|compose|narrative)\b/i.test(t);
  const hasComplex=/\b(architect|design system|optimize|performance|concurrency|thread.?safe|lock.?free|cache|SIMD|allocator|Vulkan|D3D|Metal|WebGPU|ECS|job system|undefined behaviour|ABI)\b/i.test(t) || S.ws==='studio';
  const hasQuick=/\b(quick|brief|short|tl;dr|just tell me|one sentence|yes or no)\b/i.test(t) || len<6;
  const multiQ=(t.match(/\?/g)||[]).length>1;
  const longForm=chars>800 || len>120;
  const techDensity=(t.match(/\b(api|sdk|http|json|async|await|promise|mutex|atomic|pointer|memory|latency|throughput|algorithm|complexity|O\([nlog]\))\b/gi)||[]).length;

  let scores={code:0,reason:0,write:0,fast:0,chat:1};
  if(hasCode || /bug|error|compile|debug|refactor|implement|function|class|module/i.test(t)) scores.code+=4;
  if(hasMath || hasReason || multiQ || longForm) scores.reason+=3;
  if(hasWrite) scores.write+=4;
  if(hasComplex) {scores.code+=2; scores.reason+=3;}
  if(hasQuick && !hasComplex && !hasCode) scores.fast+=5;
  if(techDensity>3) {scores.code+=1; scores.reason+=1;}
  if(len>40 && !hasQuick) scores.reason+=1;
  if(S.mode==='code' || S.ws==='studio') scores.code+=2;
  if(S.mode==='deep' || S.mode==='math') scores.reason+=2;
  if(S.mode==='write') scores.write+=2;
  if(S.mode==='quick') scores.fast+=3;

  let kd='chat', max=-1;
  for(const k of Object.keys(scores)) if(scores[k]>max){max=scores[k]; kd=k;}

  // Effort selection: low/medium/high/extra/max
  let effort='medium';
  if(hasQuick && !hasComplex && scores.reason<2) effort='low';
  else if(hasComplex || longForm || scores.reason>=5 || scores.code>=5 || S.ws==='studio') effort='extra';
  else if(multiQ || hasMath || scores.reason>=3 || chars>400) effort='high';
  else if(len<12 && !hasCode) effort='low';
  // Respect mode mins and user setting, but allow Cortex to bump up for hard asks
  const userLv=S.lv, modeMin=M().min;
  const rank=l=>LVS.indexOf(l);
  if(modeMin && rank(modeMin)>rank(effort)) effort=modeMin;
  if(rank(userLv)>rank(effort) && userLv!=='low') effort=userLv; // user can force higher, but Cortex can still raise for complex
  if(S.ws==='studio' && rank(effort)<rank('extra')) effort='extra';
  if(effort==='extra' && (hasComplex || longForm || scores.reason>=6)) effort='max';

  return {kd, effort, scores, reason:`signals: code=${scores.code} reason=${scores.reason} write=${scores.write} fast=${scores.fast} → ${kd}/${effort}`};
}

// ---- thinking levels: low/medium = 1 pass, high = deep 1 pass, extra = +review, max = plan + answer + review ----
const note=(ms,x)=>{ms=ms.map(m=>({...m}));const l=ms[ms.length-1];
 if(l&&l.role=='user')l.content=Array.isArray(l.content)?[...l.content,{type:'text',text:x}]:(l.content||'')+'\n\n'+x;else ms.push({role:'user',content:x});return ms};
async function think(msgs,needV,kd,onWait,onStep,onTok){
 const lv=LV(),qt=()=>{},sys={role:'system',content:[SYS[lv]||DEEP,M().sys,studioCtx(),'Today is '+new Date().toDateString()+'.'].filter(Boolean).join(' ')};
 const run=(ms,not,tk)=>ask([sys,...ms],needV,kd,onWait,not,tk);let plan='';
 const fin=lv!='extra'&&lv!='max';
 if(lv=='max'){onStep('Planning...');plan=(await run(note(msgs,'Before answering my last message, write a short plan: key considerations, pitfalls and approach. Output only the plan.'),undefined,qt)).text}
 onStep('Thinking...');
 let r=await run(plan?note(msgs,'Follow this plan to fully answer my last message:\n'+plan):msgs,undefined,fin?onTok:qt);
 if(!fin){onStep('Reviewing...');
  r=await run([...msgs,{role:'assistant',content:r.text},{role:'user',content:'Review your answer for mistakes, gaps or weak reasoning, then output only the improved final answer.'}],r.p,onTok)}
 return r}

async function send(txt){
 const text=(typeof txt=='string'?txt:$('#q').value).trim();if((!text&&!pending.length)||busy)return;
 if(!chat())newChat();const c=chat();
 c.m.push({r:'user',t:text,i:pending});if(c.t=='New chat')c.t=(text||'Image').slice(0,30);
 const needV=pending.length>0;pending=[];prev();$('#q').value='';$('#q').style.height='auto';setBusy(true);stopReq=false;save();draw();
 const b=bubble('assistant','Thinking...');b.classList.add('load');const sp=b.querySelector('span');
 let dl=0,pv='',lab='Thinking...',streaming=false,raf=0,last='';
 const onTok=t=>{last=t;streaming=true;b.classList.remove('load');if(raf)return;
  raf=requestAnimationFrame(()=>{raf=0;const lg=$('#log'),near=lg.scrollHeight-lg.scrollTop-lg.clientHeight<150;sp.innerHTML=md(last);if(near)lg.scrollTop=1e9})};
 const show=()=>{if(streaming)return;sp.textContent=dl?`All limits maxed. Waiting ${Math.max(0,Math.ceil((dl-Date.now())/1000))}s for ${pv} to unlock...`:lab};
 const tk=setInterval(show,250);
 try{
  const msgs=ctx(c.m).map((m,n,a)=>({role:m.r,content:m.i&&m.i.length?(n==a.length-1?
   [{type:'text',text:m.t||'Describe this image.'},...m.i.map(u=>({type:'image_url',image_url:{url:u}}))]:(m.t||'')+' [image]'):m.t}));
  lastAnalysis = needV ? {kd:'chat',effort:S.lv||'medium'} : analyzeRequest(text);
  const kd = M().kd || lastAnalysis.kd;
  const res=await think(msgs,needV,kd,k=>{dl=k?k.cool:0;pv=k?cap(k.p):'';show()},l=>{lab=l;show()},onTok);
  const effortLabel = cap(LV());
  c.m.push({r:'assistant',t:res.text,via:`${res.via} · ${M().n} · ${effortLabel}`+(stopReq?' · stopped':'')+(lastAnalysis&&lastAnalysis.reason?' · cortex':'')})
 }catch(e){c.m.push(e.stop?(last?{r:'assistant',t:last,via:'Stopped'}:{r:'assistant',t:'Stopped.',e:1}):{r:'assistant',t:'⚠ '+e.message,e:1})}
 clearInterval(tk);cancelAnimationFrame(raf);setBusy(false);stopReq=false;save();draw();
}

// ---- settings ----
const TEST=new Map();
async function testKey(k){
 const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),25000);
 try{
  const ms=[{role:'system',content:'Reply with the single word OK.'},{role:'user',content:'Say OK.'}];
  const o=k.p=='anthropic'?anth(k,ms,false,null):{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+k.key},body:JSON.stringify({model:k.m||P[k.p].m,messages:ms})};
  o.credentials='omit';o.referrerPolicy='no-referrer';o.cache='no-store';o.signal=ctl.signal;
  let r;try{r=await fetch(P[k.p].url,o)}catch(e){return ctl.signal.aborted?'No response in 25 seconds.':'Could not reach '+cap(k.p)+'. No internet, or this provider blocks requests from apps.'}
  let j={};try{j=await r.json()}catch(_){}
  const msg=(typeof j.error=='string'?j.error:j.error?.message)||j.message||j[0]?.error?.message||'';
  if(r.ok){const out=k.p=='anthropic'?(j.content||[]).map(b=>b.text||'').join(''):txt(j.choices?.[0]?.message?.content),rc=j.choices?.[0]?.message?.reasoning_content;
   return (clean(out).trim()||rc)?'\u2713 Works':'Reachable, but the model sent an empty reply.'}
  if(r.status==401||r.status==403)return 'Key rejected ('+r.status+'). Check the whole key was pasted and has API access.';
  if(r.status==429)return 'Key is valid but rate-limited or out of credit right now.';
  if(r.status==404||/model/i.test(msg))return 'Model name not found for this key. Edit it in settings. '+msg.slice(0,100);
  return cap(k.p)+' error '+r.status+(msg?': '+msg.slice(0,120):'')
 }finally{clearTimeout(to)}}
function keysUI(){const now=Date.now();$('#keys').innerHTML='';
 S.keys.forEach(k=>{const r=document.createElement('div');r.className='row';
  const st=k.dead?'rejected':k.cool>now?'cooling '+Math.ceil((k.cool-now)/1000)+'s':'ready';
  const l=document.createElement('div');l.className='t';l.textContent=`${cap(k.p)} ...${k.key.slice(-4)}${k.m?' · '+k.m:''} · ${st}`+(TEST.get(k)?' · '+TEST.get(k):'');
  const x=document.createElement('button');x.innerHTML=ic('trash',18);x.onclick=()=>{S.keys=S.keys.filter(z=>z!=k);save();keysUI()};
  const tb=document.createElement('button');tb.textContent='Test';tb.className='tst';
  tb.onclick=async()=>{TEST.set(k,'testing...');keysUI();const m=await testKey(k);TEST.set(k,m);if(m.startsWith('\u2713')){k.dead=false;k.cool=0;save()}keysUI()};
  r.append(l,tb,x);$('#keys').appendChild(r)})}
function fill(){const p=P[$('#np').value];$('#nm').value=p.m;$('#nv').value=p.v}
$('#np').innerHTML=Object.keys(P).map(p=>`<option value="${p}">${cap(p)}</option>`).join('');$('#np').onchange=fill;fill();
$('#pick').innerHTML='<option value="auto">Auto</option>'+Object.keys(P).map(p=>`<option value="${p}">${cap(p)}</option>`).join('');
$('#pick').value=S.pick;$('#lv').value=S.lv;
$('#pick').onchange=e=>{S.pick=e.target.value;save()};$('#lv').onchange=e=>{S.lv=e.target.value;save()};
$('#add').onclick=()=>{const key=$('#nk').value.trim();if(!key)return;
 if(S.keys.some(z=>z.p==$('#np').value&&z.key==key)){const ab=$('#add');ab.textContent='Already added';setTimeout(()=>ab.textContent='Add key',1500);return}
 S.keys.push({p:$('#np').value,key,m:$('#nm').value.trim(),v:$('#nv').value.trim(),cool:0,dead:false});$('#nk').value='';save();
 const nk=S.keys[S.keys.length-1];TEST.set(nk,'testing...');keysUI();testKey(nk).then(m=>{TEST.set(nk,m);keysUI()})};
$('#rst').onclick=()=>{S.keys.forEach(k=>{k.cool=0;k.dead=false});save();keysUI()};
$('#gear').onclick=()=>{$('#un').value=S.name;keysUI();$('#set').showModal()};
$('#x').onclick=()=>$('#set').close();
$('#set').addEventListener('close',()=>{S.name=$('#un').value.trim();save();if(!busy)draw()});
$('#menu').onclick=()=>{$('#drawer').classList.add('open');$('#scrim').classList.add('open')};
$('#scrim').onclick=closeDrawer;$('#new').onclick=newChat;$('#newb').onclick=newChat;
window.__cgptPickerOpen=false;
$('#file').addEventListener('click',()=>{window.__cgptPickerOpen=true});
$('#file').addEventListener('cancel',()=>{window.__cgptPickerOpen=false});
const CODE_RE=/\.(cpp|cc|cxx|c|h|hpp|hh|hxx|inl|ipp|cs|py|js|ts|rs|go|java|kt|txt|md|json|yaml|yml|toml|cmake|glsl|hlsl|wgsl|vert|frag|comp|shader|ini|cfg|log)$/i;
$('#file').onchange=async e=>{try{for(const f of e.target.files){
 if((f.type||'').startsWith('image/')){if(pending.length>=6){toast('Up to 6 images per message.');continue}try{pending.push(await shrink(f))}catch(_){toast("Couldn't read that image.")}}
 else if(CODE_RE.test(f.name)||(f.type||'').startsWith('text/')){if(f.size>400000){toast(f.name+' is too large (400 KB max).');continue}
  try{const tx=await f.text(),q=$('#q'),ext=(f.name.split('.').pop()||'').toLowerCase();q.value+=(q.value?'\n\n':'')+'// File: '+f.name+'\n```'+ext+'\n'+tx.replace(/\n$/,'')+'\n```\n';q.style.height='auto';q.style.height=q.scrollHeight+'px'}catch(_){toast("Couldn't read "+f.name)}}
 else toast('Unsupported file: '+f.name)}}finally{window.__cgptPickerOpen=false;e.target.value='';prev()}};
$('#send').onclick=()=>busy?stop():send();
$('#q').addEventListener('keydown',e=>{if(e.key=='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();send()}});
$('#q').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'});

  b.innerHTML=`<span style="display:flex;gap:10px;align-items:center">${ic(MI[id],18)}${m.n}</span>`;const s=document.createElement('small');s.textContent=m.d||'';b.appendChild(s);
  b.onclick=()=>{S.mode=id;save();chip();d.hidden=true};d.appendChild(b)})}

[['menu','Menu'],['newb','New chat'],['gear','Settings'],['plus','Modes'],['send','Send'],['clip','Attach image or code file'],['new','New chat'],['lv','Thinking level'],['pick','Provider'],['q','Message'],['x','Done']].forEach(([i,l])=>$('#'+i).setAttribute('aria-label',l));

 $('#tasks').hidden=!st;$('#plus').hidden=st;$('#modes').hidden=true;if(st)$('#chip').hidden=true;else chip();

$('#log').addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.cb');if(!b)return;const t=b.closest('.cw').querySelector('code').textContent;
 const ok=()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200)};
 const fb=()=>{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove();ok()};
 try{navigator.clipboard.writeText(t).then(ok,fb)}catch(_){fb()}});
chip();applyWs();if(!S.keys.length){$('#set').showModal();$('#nk').focus();}
